<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Abstract Tech Nodes -->
  <g opacity="0.4">
    <circle cx="100" cy="100" r="4" fill="#2563eb" />
    <circle cx="100" cy="300" r="4" fill="#2563eb" />
    <circle cx="300" cy="100" r="4" fill="#2563eb" />
    <circle cx="300" cy="300" r="4" fill="#2563eb" />
    <circle cx="500" cy="200" r="6" fill="#1d4ed8" />
    <circle cx="600" cy="400" r="4" fill="#2563eb" />
    
    <!-- Lines connecting nodes -->
    <line x1="100" y1="100" x2="300" y2="100" stroke="#3b82f6" stroke-width="1" />
    <line x1="100" y1="100" x2="100" y2="300" stroke="#3b82f6" stroke-width="1" />
    <line x1="100" y1="300" x2="300" y2="300" stroke="#3b82f6" stroke-width="1" />
    <line x1="300" y1="100" x2="300" y2="300" stroke="#3b82f6" stroke-width="1" />
    <line x1="300" y1="100" x2="500" y2="200" stroke="#3b82f6" stroke-width="1" />
    <line x1="300" y1="300" x2="500" y2="200" stroke="#3b82f6" stroke-width="1" />
    <line x1="500" y1="200" x2="600" y2="400" stroke="#3b82f6" stroke-width="1" />
  </g>
  
  <!-- Decorative Code-like elements -->
  <g transform="translate(50, 450)" opacity="0.2">
    <rect x="0" y="0" width="100" height="8" rx="2" fill="#475569" />
    <rect x="0" y="15" width="160" height="8" rx="2" fill="#475569" />
    <rect x="0" y="30" width="140" height="8" rx="2" fill="#475569" />
    <rect x="20" y="45" width="80" height="8" rx="2" fill="#475569" />
    <rect x="20" y="60" width="120" height="8" rx="2" fill="#475569" />
  </g>
</svg>