# Drop into the nginx server block for tdeak67.com (HTTPS server).
# First line of defence: per-IP rate limit for the AI chat proxy.

# (http context) define the zone once:
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=6r/m;

location /api/chat {
    limit_req zone=chat_api burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8020/v1/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_buffering off;
}
